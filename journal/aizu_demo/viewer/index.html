<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BST-ID UTM + Tsuruga Castle Demo</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.134/Build/Cesium/Cesium.js"></script>
  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.134/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  >

  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .control-panel {
      position: absolute;
      z-index: 1000;
      top: 12px;

      box-sizing: border-box;
      padding: 12px 14px;

      color: #fff;
      background: rgba(10, 14, 18, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);

      font-size: 14px;
      line-height: 1.35;

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #toolbar {
      left: 12px;
      width: min(730px, calc(100% - 410px));
    }

    #castleToolbar {
      right: 12px;
      width: 370px;
    }

    .control-panel .title {
      margin-bottom: 9px;
      font-size: 16px;
      font-weight: 700;
    }

    .toolbar-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 13px;
      align-items: center;
    }

    .control-panel label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .control-panel input[type="checkbox"] {
      width: 15px;
      height: 15px;
    }

    .control-panel select,
    .control-panel button {
      min-height: 28px;
      font-size: 13px;
    }

    .control-panel button {
      padding: 3px 9px;
      cursor: pointer;
    }

    .status-box {
      margin-top: 9px;
      padding: 7px 8px;
      color: #fff;
      background: rgba(0, 0, 0, 0.30);
      border-radius: 5px;
      font-size: 13px;
      line-height: 1.45;
    }

    .error-box {
      color: #ffc2c2;
    }

    @media (max-width: 1100px) {
      #toolbar {
        width: calc(100% - 24px);
      }

      #castleToolbar {
        top: 190px;
        left: 12px;
        right: auto;
        width: min(620px, calc(100% - 24px));
      }
    }
  </style>
</head>

<body>
  <div id="toolbar" class="control-panel"></div>
  <div id="castleToolbar" class="control-panel"></div>
  <div id="cesiumContainer"></div>

  <script src="config.local.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
